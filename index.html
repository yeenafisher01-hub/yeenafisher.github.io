<!DOCTYPE html>

    <!-- Tailwind CSS for modern, smooth styling -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Custom Glamorous Lavender & Dark Purple Theme Colors */
        :root {
            --bg-lavender: #F3E8FF; 
            --text-dark-purple: #4C1D95; 
        }
        
        body {
            background-color: var(--bg-lavender);
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* Staggered entry flash animation for your headshot images */
        @keyframes photoFlash {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); filter: brightness(1.5); }
            50% { filter: brightness(1.2); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1); }
        }

        .headshot-animate {
            opacity: 0;
            animation: photoFlash 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
