<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeena Fisher | Official Portfolio</title>
    <style>
        /* 100% NATIVE CSS PLATFORM - NO FRAMEWORKS OR COMPILED SCRIPT CONFLICTS */
        :root {
            --light-lavender: #EFE5FF;   /* Your exact light lavender banner color */
            --plush-purple: #3A1F4C;      /* Your elegant deep purple branding color */
            --border-purple: #D6BCFA;
            --pure-white: #ffffff;
        }
       
        body {
            background-color: var(--pure-white); /* Clean, high-contrast white body background */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;	
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. LIGHT LAVENDER TOP NAV BANNER WITH VENUE STYLING */
        header {
            background-color: var(--light-lavender);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 2px solid var(--border-purple);
            box-shadow: 0 4px 10px rgba(58, 31, 76, 0.05);
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .header-container {
                flex-direction: row;
                gap: 0;
            }
        }

        .logo-abbreviation {
            color: var(--plush-purple);
            font-family: 'Georgia', serif;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        header nav a {
            color: var(--plush-purple);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        header nav a:hover {
            color: #8B5CF6;
            transform: translateY(-1px);
        }

        /* MAIN CONTENT ROW CONSTRAINTS */
        main {
            flex-grow: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* 2. LARGE SIZE BRAND NAME AT THE TOP CENTER */
        .name-banner-block {
            text-align: center;
            padding: 20px 0;
        }

        .exotic-name {
            color: var(--plush-purple);
            font-family: 'Baskerville', 'Georgia', serif;
            font-weight: bold;
            font-style: italic;
            font-size: 48px; /* Your requested large name size */
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }

        .exotic-subtitle {
            margin: 10px 0 0 0;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--plush-purple);
            opacity: 0.85;
        }

        /* 3. MAIN HERO PROFILE HEADSHOT BLOCK POSITIONED DIRECTLY BELOW NAME */
        .hero-section {
            display: flex;
            justify-content: center;
        }

        .hero-card {
            max-width: 320px;
            width: 100%;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(58, 31, 76, 0.1);
            border: 4px solid #ffffff;
            background-color: #ffffff;
        }

        .hero-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* CONTENT CONTENT SECTIONS (NO BLACK OR PURPLE BORDERS) */
        .section-wrapper {
            background-color: var(--pure-white);
            padding: 20px 0;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--plush-purple);
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #F3E8FF;
            padding-bottom: 10px;
        }

        .bio-text {
            font-size: 17px;
            line-height: 1.8;
            color: #374151;
            margin: 0;
            text-align: center;
            font-family: 'Georgia', serif;
            font-style: italic;
        }

        /* SQUARE CONTAINER FOR PROMINENT DEMO REEL */
        .square-reel-box {
            max-width: 500px;
            width: 100%;
            margin: 0 auto 24px auto;
            background-color: #000000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
            border: 4px solid #ffffff;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .square-reel-box iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* STRATEGIC DARK PURPLE PROFILE BADGES POSITIONED DIRECTLY BELOW REEL */
        .badge-link-container {
            max-width: 600px;
            margin: 0 auto 10px auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 500px) {
            .badge-link-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .dark-purple-badge {
            background-color: var(--plush-purple);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(58, 31, 76, 0.15);
            transition: all 0.2s ease;
        }

        .dark-purple-badge:hover {
            background-color: #4C1D95;
            transform: translateY(-2px);
        }

        /* BALANCED PORTFOLIO IMAGE GRIDS */
        .gallery-display-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 768px) {
            .theatrical-layout {
                grid-template-columns: repeat(6, 1fr); /* Exactly 6 top and 6 bottom for 12 looks */
            }
            .commercial-layout {
                grid-template-columns: repeat(4, 1fr);  /* Balanced row of 4 horizontal panels */
            }
            .redcarpet-layout {
                grid-template-columns: repeat(6, 1fr); /* Exactly 6 top and 6 bottom for 12 assets */
            }
        }

        .photo-card-frame {
            aspect-ratio: 3 / 4;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid var(--border-purple);
            background-color: #fcfbfa;
            cursor: pointer;
        }

        .photo-card-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .photo-card-frame:hover img {
            transform: scale(1.04);
        }

        /* FULL DISPLAY LIGHTBOX */
        .lightbox-window {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .lightbox-window img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            border: 4px solid #ffffff;
        }
    </style>
</head>
<body>

    <!-- 1. LIGHT LAVENDER TOP NAVIGATION BANNER -->
    <header>
        <div class="header-container">
            <div class="logo-abbreviation">YF</div>
            <nav>
                <a href="#about">Bio</a>
                <a href="#reel">Demo Reel</a>
                <a href="#theatrical">Theatrical</a>
                <a href="#commercial">Commercial</a>
                <a href="#redcarpet">Red Carpet</a>
                <a href="Fisher_resume.pdf" target="_blank">Resume</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CORES DISPLAY -->
    <main>

        <!-- 2. LARGE SIZE BRAND NAME AT THE ABSOLUTE TOP OF MAIN HUB -->
        <div class="name-banner-block">
            <h1 class="exotic-name">YEENA FISHER</h1>
            <p class="exotic-subtitle">Actress &bull; Filmmaker &bull; Producer &bull; Writer</p>
        </div>

        <!-- 3. CENTERED MAIN HERO PROFILE HEADSHOT BLOCK -->
        <section class="hero-section">
            <div class="hero-card">
                <img src="headshot_main.jpg" alt="Yeena Fisher Principal Look">
            </div>
        </section>

        <!-- 4. BIOGRAPHY TEXT SECTION -->
        <section id="about" class="section-wrapper">
            <h2 class="section-title">Biography</h2>
            <p class="bio-text">
                An accomplished multi-hyphenate artist with over 60 professional narrative credits spanning a prolific career as an actress, filmmaker, producer, and writer.
            </p>
        </section>
