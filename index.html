<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeena Fisher | Official Portfolio</title>
    <style>
        /* SECURED INDEPENDENT ENGINE - PREVENTS STYLING LOSS */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #F3E8FF !important; /* Locks your beautiful lavender background color */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #111827;
            padding-bottom: 60px;
        }

        /* WHITE TOP BANNER NAVIGATION BAR */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #E9D5FF;
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .branding-group {
            display: flex;
            flex-direction: column;
        }

        /* EXOTIC CURSIVE FONT BOLD LETTERS IN PURPLE COLOR */
        h1 {
            color: #4C1D95 !important;
            font-family: 'Brush Script MT', 'Comic Sans MS', 'Georgia', cursive, serif;
            font-weight: bold;
            font-size: 38px;
            letter-spacing: 0.02em;
            line-height: 1.1;
        }

        /* TAGLINE DIRECTLY UNDER THE NAME */
        .tagline {
            color: #6D28D9;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 4px;
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav a {
            color: #5B21B6;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        nav a:hover { color: #7C3AED; }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* CONTRAST RECTANGLE BOX CONTAINERS */
        .content-section {
            background-color: #ffffff;
            border: 1px solid #E9D5FF;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 40px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        h2 {
            color: #4C1D95;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 1px solid #F3E8FF;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        /* MAIN HERO PRESENTATION FRAME SETUP */
        .hero-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        .hero-frame {
            max-width: 380px;
            width: 100%;
            aspect-ratio: 3/4;
            background-color: #ffffff;
            border: 4px solid #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .hero-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.4s ease-in-out;
        }

        /* THEATRICAL: WIDE RECTANGLE 6 SECTIONS TOP / 6 SECTIONS BOTTOM */
        .grid-theatrical {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 6 side-by-side columns */
            gap: 16px;
        }

        /* COMMERCIAL: WIDE RECTANGLE WITH 4 SECTIONS */
        .grid-commercial {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 side-by-side columns */
            gap: 16px;
        }

        .grid-carpet {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .grid-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .photo-card {
            aspect-ratio: 3/4;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
            background-color: #F9FAFB;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .photo-card:hover { transform: scale(1.03); }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; }

        .carpet-card {
            aspect-ratio: 1/1;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
            cursor: pointer;
        }
        .carpet-card img { width: 100%; height: 100%; object-fit: cover; }

        .video-box {
            aspect-ratio: 16/9;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000000;
        }
        .video-box iframe { width: 100%; height: 100%; border: 0; }

        .resume-btn {
            display: inline-block;
            background-color: #4C1D95;
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 9999px;
            box-shadow: 0 4px 10px rgba(76,29,149,0.3);
            transition: background-color 0.2s;
        }
        .resume-btn:hover { background-color: #6D28D9; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #4B5563;
            margin-bottom: 6px;
            letter-spacing: 0.05em;
        }

        .form-group input, .form-group textarea {
            padding: 12px;
            border: 1px solid #E9D5FF;
            border-radius: 8px;
            background-color: #FAF5FF;
            font-size: 14px;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            background-color: #4C1D95;
            color: #ffffff;
            border: 0;
            padding: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-btn:hover { background-color: #6D28D9; }

        footer {
            background-color: #ffffff;
            border-top: 1px solid #E9D5FF;
            padding: 32px 20px;
            text-align: center;
            margin-top: 40px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
        }

        .footer-links a {
            color: #6B7280;
            text-decoration: none;
            font-size: 14px;
        }
        .footer-links a:hover { color: #4C1D95; }
        .copyright { color: #9CA3AF; font-size: 12px; }

        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: zoom-out;
        }

        #lightbox img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            border-radius: 4px;
        }

        /* SCREEN RESPONSIVENESS ADAPTATIONS FOR TABLETS AND MOBILE */
        @media (max-width: 950px) {
            .grid-theatrical { grid-template-columns: repeat(3, 1fr); }
            .grid-commercial { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .header-container { flex-direction: column; gap: 12px; text-align: center; }
            .grid-theatrical { grid-template-columns: repeat(2, 1fr); }
            .grid-carpet, .grid-videos, .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- SECURED WHITE HEADER NAVIGATION BANNER -->
    <header>
        <div class="header-container">
            <div class="branding-group">
                <h1>Yeena Fisher</h1>
                <div class="tagline">Actress Filmmaker and Dancer</div>
            </div>
            <nav>
                <a href="#theatrical">Theatrical</a>
                <a href="#commercial">Commercial</a>
                <a href="#media">Red Carpets</a>
                <a href="#resume">Resume</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <main>

        <!-- CENTERED LIVE SLIDESHOW ROTATOR PANEL WITH FLASH EFFECT OVERLAY -->
        <div class="hero-section">
            <div class="hero-frame">
                <img id="main-slideshow-reel" src="headshot_main.jpg" alt="Yeena Fisher Presentation Frame">
            </div>
        </div>

        <!-- RECTANGLE THEATRICAL GRID (6 SECTIONS ON TOP, 6 SECTIONS ON BOTTOM) -->
        <section id="theatrical" class="content-section">
            <h2>Theatrical Headshots</h2>
