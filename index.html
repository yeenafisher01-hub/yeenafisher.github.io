<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeena Fisher | Official Portfolio</title>
    
    <!-- EMBED THE EXOTIC GREAT VIBES FONT DIRECTLY FROM GOOGLE FONTS -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <style>
        /* 100% NATIVE CSS STYLE SHEET - NO EXTERNAL TAILWIND PACKAGES OR FRAMEWORKS REQUIRED */
        :root {
            --light-lavender: #EFE5FF;   /* Top header banner venue color */
            --plush-purple: #3A1F4C;      /* Main exotic name script color */
            --glow-purple: #8B5CF6;       /* Radiant badge boundary highlight */
            --pure-white: #ffffff;
            --text-dark: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* LUMINOUS, GLAMOROUS LIGHT LAVENDER VERTICAL GRADIENT BACKGROUND */
        body {
            background: linear-gradient(180deg, #F9F5FF 0%, #EFE6FF 50%, #DCD0F7 100%);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* STICKY LIGHT LAVENDER TOP NAVIGATION BAR */
        header {
            background-color: var(--pure-white);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #D6BCFA;
            box-shadow: 0 4px 12px rgba(58, 31, 76, 0.06);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .header-container {
                flex-direction: row;
                gap: 0;
            }
        }

        .logo-box {
            color: var(--plush-purple);
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 1px;
        }

        header nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }

        header nav a {
            color: var(--plush-purple);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s ease;
        }

        header nav a:hover {
            color: var(--glow-purple);
            transform: translateY(-1px);
        }

        /* MAIN APP PLATFORM BOX */
        main {
            flex-grow: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        /* CENTERED EXOTIC CURSIVE BRAND TITLE BLOCK */
        .title-banner-container {
            text-align: center;
            margin-top: 10px;
        }

        .brand-name-title {
            font-family: 'Great Vibes', cursive;
            font-weight: 700;
            font-size: 84px; /* Scaled up heavily to make it beautifully thick, bold, and prominent */
            color: var(--plush-purple);
            text-transform: none; /* Cursive connects flawlessly in mixed case formatting */
            line-height: 1.1;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(58, 31, 76, 0.1);
        }

        .sub-roles-line {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--plush-purple);
            opacity: 0.9;
            margin-bottom: 24px;
        }

        .intro-paragraph-text {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            line-height: 1.8;
            max-width: 750px;
            margin: 0 auto;
            color: #2D1A3C;
            text-align: center;
        }

        /* STATISTICAL METRIC SUB-BIO CALLOUT ACCENT */
        .production-stat-badge {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #5B21B6;
            margin-top: 16px;
            display: block;
            opacity: 0.95;
        }

        /* CENTERED HERO LAYOUT GRID WITH SIDE TEXT STRINGS */
        .hero-layout-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }

        @media (min-width: 768px) {
            .hero-layout-wrapper {
                grid-template-columns: 1fr auto 1fr;
            }
        }

        .side-text-left {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--plush-purple);
            line-height: 1.6;
        }

        @media (min-width: 768px) {
            .side-text-left { text-align: right; }
        }

        .main-avatar-holder {
            max-width: 340px;
            width: 100%;
            margin: 0 auto;
            border-radius: 50% 50% 20px 20px; /* Modern stylized framing */
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(58, 31, 76, 0.15);
            border: 6px solid var(--pure-white);
            background-color: var(--pure-white);
        }

        .main-avatar-holder img {
            width: 100%;
            height: auto;
            display: block;
        }

        .side-text-right-cursive {
            text-align: center;
            font-family: 'Great Vibes', cursive;
            font-size: 38px;
            color: #5B21B6;
            transform: rotate(-4deg);
            line-height: 1.3;
        }

        @media (min-width: 768px) {
            .side-text-right-cursive { text-align: left; padding-left: 20px; }
        }

        /* GLOWING INTERACTIVE LINK BADGES (ROW OF 4 INTERACTIVE TILES) */
        .badges-grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        @media (min-width: 640px) {
            .badges-grid-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .glow-link-badge {
            background: linear-gradient(135deg, #FDFEFE 0%, #F5EEFF 100%);
            border: 2px solid #D6BCFA;
            border-radius: 12px;
            padding: 16px 12px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 16px rgba(139, 92, 246, 0.08);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glow-link-badge:hover {
            transform: translateY(-3px);
            border-color: var(--glow-purple);
            box-shadow: 0 12px 24px rgba(139, 92, 246, 0.2);
            background: var(--pure-white);
        }

        .badge-main-title {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--plush-purple);
            margin-bottom: 4px;
        }

        .badge-sub-action {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--glow-purple);
        }

        /* STATEMENT SEPARATOR TRAILER BAR */
        .statement-trailer-bar {
            background-color: var(--plush-purple);
            color: var(--pure-white);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .statement-trailer-bar span {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ELEGANT PORTFOLIO GRID PREVIEW CONTAINER CARDS */
        .gallery-panels-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .gallery-panels-wrapper {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .preview-luxury-card {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(214, 188, 250, 0.5);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 10px 25px rgba(58, 31, 76, 0.04);
            transition: all 0.3s ease;
        }

        .preview-luxury-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(58, 31, 76, 0.08);
            background-color: var(--pure-white);
