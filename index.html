<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeena Fisher | Official Portfolio</title>
    <style>
        /* CLEAN NATIVE CSS STYLES - NO TAILWIND PACKAGES OR FRAMEWORKS REQUIRED */
        :root {
            --bg-dark: #0f0c1b;            /* Deep, elegant dark background background */
            --panel-dark: #19142d;         /* Slightly lighter contrast dark paneling */
            --mauve-purple: #9d5cf7;       /* Rich, glowing dark mauve purple brand color */
            --text-light: #f3f0fa;         /* Crisp, high-contrast readable text lines */
            --text-muted: #a69ebd;         /* Soft muted text labels */
            --pure-black: #000000;         /* Solid black blocks for section anchors */
        }
       
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        /* NAVIGATION HEADER */
        header {
            background-color: rgba(25, 20, 45, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 40;
            border-b: 1px solid rgba(157, 92, 247, 0.2);
            padding: 20px 40px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .header-container {
                flex-direction: row;
            }
        }

        /* EXOTIC BASKERVILLE BOLD ITALIC MAIN BRAND NAME */
        .brand-name {
            font-family: 'Baskerville', 'Georgia', serif;
            font-weight: bold;
            font-style: italic;
            font-size: 48px;
            color: var(--mauve-purple);
            letter-spacing: 1px;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .brand-name:hover {
            opacity: 0.85;
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--mauve-purple);
        }

        /* MAIN CONTENT STRUCTURE */
        main {
            flex-grow: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .space-container {
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        /* NATIVE SOLID BLACK HEADER RECTANGLES WITH WHITE TEXT */
        .section-anchor {
            background-color: var(--pure-black);
            color: #ffffff;
            padding: 14px 24px;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
            border-left: 5px solid var(--mauve-purple);
        }

        .panel-section {
            background-color: var(--panel-dark);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(157, 92, 247, 0.1);
        }

        /* BIO STYLING */
        .bio-text {
            font-family: 'Georgia', serif;
            font-size: 20px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            color: var(--text-light);
            line-height: 1.8;
            font-style: italic;
        }

        /* GRID STRUCTURAL CALCULATIONS */
        .grid-12 {
            display: grid;
            grid-template-cols: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 768px) {
            .grid-12 {
                grid-template-cols: repeat(6, 1fr); /* Exactly 6 top and 6 bottom */
            }
        }

        .grid-4 {
            display: grid;
            grid-template-cols: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 768px) {
            .grid-4 {
                grid-template-cols: repeat(4, 1fr); /* Clean row of 4 horizontal panels */
            }
        }

        /* HOVER EFFECTS & FLASH CODES FOR COMPRESSED IMAGES */
        .photo-card {
            aspect-ratio: 3/4;
            overflow: hidden;
            border-radius: 8px;
            background-color: #000;
            border: 1px solid rgba(157, 92, 247, 0.15);
            cursor: pointer;
            position: relative;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-cover: block;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .photo-card:hover img {
            transform: scale(1.04);
            filter: brightness(1.1);
        }

        /* NATIVE CENTERED DEMO REEL CONTAINER */
        .video-box {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            aspect-ratio: 16/9;
            background-color: var(--pure-black);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(157, 92, 247, 0.2);
        }

        .video-box iframe {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* LIGHTBOX IMAGE EXPANDER RULES */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 6px;
            border: 3px solid #fff;
        }
    </style>
</head>
