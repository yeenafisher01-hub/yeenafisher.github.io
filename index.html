<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeena Fisher | Official Portfolio</title>
    <!-- Tailwind CSS Engine for Layout Architecture -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* SECURED HARDCODED LAYER CONFIGURATIONS */
        body {
            /* Smooth background transition: light lavender gradient fading into a darker lavender at the bottom body */
            background: linear-gradient(180deg, #F3E8FF 0%, #E9D5FF 100%) !important;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #111827;
            padding-bottom: 60px;
            min-height: 100vh;
        }

        /* EXOTIC PURPLE CURSIVE BRANDING FONT */
        .exotic-cursive-name {
            color: #4C1D95 !important;
            font-family: 'Brush Script MT', 'Comic Sans MS', 'Georgia', cursive, serif;
            font-weight: bold;
            font-size: 38px;
            letter-spacing: 0.02em;
            line-height: 1.1;
        }

        .tagline-subtext {
            color: #6D28D9;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 4px;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #D8B4FE;
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .portfolio-rectangle-container {
            background-color: #ffffff;
            border: 2px solid #C084FC;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 40px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        .darker-purple-label {
            color: #3B0764 !important;
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 2px solid #E9D5FF;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        /* EXOTIC FLASH EFFECTS SYSTEM HOUSINGS */
        .hero-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        .hero-frame {
            max-width: 380px;
            width: 100%;
            aspect-ratio: 3/4;
            background-color: #ffffff;
            border: 4px solid #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
        }

        .hero-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }

        /* The dynamic lightning slice element that sweeps across your look */
        .hero-frame::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            z-index: 50;
        }

        /* Triggers the dynamic Flash beam via JavaScript sync pulses */
        .hero-frame.trigger-flash::after {
            animation: sweepFlashBeam 0.5s ease-out;
        }

        @keyframes sweepFlashBeam {
            100% { left: 150%; }
        }

        /* PHOTO THUMBNAIL GRIDS SYSTEM */
        .compact-photo-card {
            aspect-ratio: 3/4;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
            background-color: #F9FAFB;
            cursor: pointer;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        .compact-photo-card:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 15px -3px rgba(76,29,149,0.2);
        }

        .compact-photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .theatrical-6x2-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* Clean 6 Columns Wide Matrix */
            gap: 16px;
        }

        .commercial-4x1-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Clean 4 Columns Wide Matrix */
            gap: 16px;
        }

        .grid-carpet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-videos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }

        @media (max-width: 1024px) { .theatrical-6x2-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 640px) {
            .theatrical-6x2-grid { grid-template-columns: repeat(2, 1fr); }
            .commercial-4x1-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

            <div style="margin-bottom: 40px;">
                <h2 class="darker-purple-label">Red Carpet Gallery</h2>
                <div class="grid-carpet">
