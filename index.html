<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeena Fisher | Official Portfolio</title>
    <!-- Tailwind CSS Engine for Base Layout Configurations -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* SECURED INTERNAL LAYOUT ENGINE - PREVENTS BACKGROUND LOOPS */
        body {
            /* Smooth background transition: light lavender fading into a slightly darker lavender shade at the bottom */
            background: linear-gradient(180deg, #F3E8FF 0%, #D8B4FE 100%) !important;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #111827;
            padding-bottom: 60px;
            min-height: 100vh;
        }

        /* EXOTIC PURPLE CURSIVE BRANDING TEXT */
        .exotic-brand-name {
            color: #4C1D95 !important;
            font-family: 'Brush Script MT', 'Comic Sans MS', 'Georgia', cursive, serif !important;
            font-weight: bold !important;
            font-size: 40px !important;
            letter-spacing: 0.02em;
            line-height: 1.1;
            margin: 0;
        }

        .tagline-subtext {
            color: #6D28D9 !important;
            font-size: 14px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.15em !important;
            margin-top: 5px;
        }

        /* WHITE BANNER TOP NAVIGATION HEADER */
        header {
            background-color: #ffffff !important;
            border-bottom: 2px solid #C084FC !important;
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 10000;
            padding: 20px 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 100%;
        }

        /* PURPLE CONTENT BOX CONTRAST CONTAINER RECTANGLES */
        .portfolio-box-container {
            background-color: #ffffff !important;
            border: 2px solid #C084FC !important;
            border-radius: 16px !important;
            padding: 32px !important;
            margin-bottom: 45px !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05) !important;
            width: 100%;
            display: block;
        }

        /* DEFINED DARK PURPLE ROW LABELS */
        .section-purple-label {
            color: #3B0764 !important;
            font-size: 22px !important;
            font-weight: 800 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.08em !important;
            border-bottom: 2px solid #F3E8FF !important;
            padding-bottom: 12px !important;
            margin-bottom: 24px !important;
        }

        /* CENTERED SLIDESHOW PANEL HOUSINGS */
        .hero-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
            width: 100%;
        }

        .hero-frame {
            max-width: 380px;
            width: 100%;
            aspect-ratio: 3/4;
            background-color: #ffffff;
            border: 4px solid #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
        }

        .hero-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }

        /* Modern layout sweep reflection for the dynamic flashlight effect */
        .hero-frame::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.95) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            z-index: 50;
        }

        .hero-frame.trigger-flash::after {
            animation: sweepFlashBeam 0.5s ease-out;
        }

        @keyframes sweepFlashBeam {
            100% { left: 150%; }
        }

        /* SQUARE/RECTANGLE THUMBNAIL HOUSINGS WITH HOVER POP ACTION */
        .compact-photo-card {
            aspect-ratio: 3/4 !important;
            overflow: hidden !important;
            border-radius: 8px !important;
            border: 1px solid #E5E7EB !important;
            background-color: #F9FAFB !important;
            cursor: pointer !important;
            width: 100%;
            transition: transform 0.2s ease-in-out;
        }

        .compact-photo-card:hover {
            transform: scale(1.04);
        }

        .compact-photo-card img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
        }

        /* FORCED RECTANGLE ALIGNED COLUMNS GRID SYSTEMS */
        .grid-theatrical-6x2 {
            display: grid !important;
            grid-template-columns: repeat(6, 1fr) !important; /* Forces 6 side-by-side columns across the box */
            gap: 16px !important;
        }

        .grid-commercial-4x1 {
            display: grid !important;
            grid-template-columns: repeat(4, 1fr) !important; /* Forces 4 side-by-side columns across the box */
            gap: 16px !important;
        }

        .grid-carpet-3x1 {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 16px !important;
        }

        .grid-videos-2x1 {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 24px !important;
        }

        .carpet-card {
            aspect-ratio: 1/1 !important;
            overflow: hidden !important;
            border-radius: 8px !important;
            border: 1px solid #E5E7EB !important;
            cursor: pointer !important;
            width: 100%;
        }

        .carpet-card img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
        }

        .video-wrapper-box {
            aspect-ratio: 16/9 !important;
            width: 100% !important;
            border-radius: 12px !important;
            overflow: hidden !important;
            background-color: #000000 !important;
        }

        .video-wrapper-box iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
        }

        .resume-download-btn {
            display: inline-block !important;
            background-color: #4C1D95 !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            text-decoration: none !important;
            padding: 14px 45px !important;
            border-radius: 9999px !important;
            box-shadow: 0 4px 12px rgba(76,29,149,0.3) !important;
            transition: background-color 0.2s;
        }

        .resume-download-btn:hover { background-color: #6D28D9 !important; }

        .form-row-split {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 16px !important;
            margin-bottom: 16px !important;
        }

        .form-input-group {
            display: flex !important;
            flex-direction: column !important;
            margin-bottom: 16px !important;
            width: 100%;
        }

        .form-input-group label {
            font-size: 11px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            color: #4B5563 !important;
            margin-bottom: 6px !important;
        }

        .form-input-group input, .form-input-group textarea {
            padding: 12px !important;
            border: 1px solid #E9D5FF !important;
            border-radius: 8px !important;
            background-color: #FAF5FF !important;
            font-size: 14px !important;
            outline: none !important;
            width: 100% !important;
        }

        .form-submit-btn {
            width: 100% !important;
            background-color: #4C1D95 !important;
            color: #ffffff !important;
            border: 0 !important;
            padding: 14px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.05em !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            transition: background-color 0.2s;
        }

        .form-submit-btn:hover { background-color: #6D28D9 !important; }

        footer {
            background-color: #ffffff !important;
            border-top: 1px solid #E9D5FF !important;
            padding: 35px 20px !important;
            text-align: center !important;
            margin-top: 50px;
            width: 100%;
        }

        .footer-links-row a {
            color: #6B7280 !important;
            text-decoration: none !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            margin: 0 12px;
        }

        .footer-links-row a:hover { color: #4C1D95 !important; }
        .copyright-text { color: #9CA3AF !important; font-size: 12px !important; }

        /* FULL INTERACTIVE MODAL EXPANSION POPUP PREVIEW */
        #lightbox-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
