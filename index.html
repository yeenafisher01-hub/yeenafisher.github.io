        /* Custom Glamorous Lavender & Dark Purple Theme Colors */
        :root {
            --bg-lavender: #F3E8FF;

        }
        
        body {
            background-color: #F3E8FF;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* The entry Flash Animation overlay on the main centered photo */
        @keyframes mainPhotoFlash {
            0% { opacity: 0; transform: scale(0.95); filter: brightness(1.8); }
            40% { filter: brightness(1.4); }
            100% { opacity: 1; transform: scale(1); filter: brightness(1); }
        }

        .main-hero-flash {
            animation: mainPhotoFlash 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
