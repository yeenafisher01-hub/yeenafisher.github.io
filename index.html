<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeena Fisher | Official Portfolio</title>
    <!-- Corrected Live Tailwind CSS Play CDN Framework Engine -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Custom Glamorous Lavender & Dark Purple Theme Colors */
        :root {
            --bg-lavender: #F3E8FF;
            --text-dark-purple: #4C1D95;
        }
       
        body {
            background-color: var(--bg-lavender);
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* Staggered entry flash animation for your headshot images */
        @keyframes photoFlash {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); filter: brightness(1.5); }
            50% { filter: brightness(1.2); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1); }
        }

        .headshot-animate {
            opacity: 0;
            animation: photoFlash 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="text-gray-900 min-h-screen flex flex-col">

    <!-- NAVIGATION HEADER -->
    <header class="bg-black sticky top-0 z-40 border-b border-purple-900 shadow-md">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-extrabold tracking-wide text-white hover:opacity-90 transition-opacity">
                YEENA FISHER
            </h1>
            <nav class="flex gap-6 text-sm font-semibold tracking-wider text-white uppercase">
                <a href="#theatrical" class="hover:text-purple-300 transition-colors">Theatrical</a>
                <a href="#commercial" class="hover:text-purple-300 transition-colors">Commercial</a>
                <a href="#media" class="hover:text-purple-300 transition-colors">Red Carpets</a>
                <a href="#resume" class="hover:text-purple-300 transition-colors">Resume</a>
                <a href="#contact" class="hover:text-purple-300 transition-colors">Contact</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 py-10 space-y-16">

        <!-- SECTION 1: HERO / MAIN HEADSHOT -->
        <section class="flex justify-center items-center py-6">
            <div class="max-w-md w-full overflow-hidden rounded-2xl shadow-xl border-4 border-white bg-white">
                <img src="headshot_main.jpg" alt="Yeena Fisher Headshot" class="w-full h-auto object-cover block mx-auto">
            </div>
        </section>

        <!-- SECTION 2: THEATRICAL HEADSHOTS (ALL EXTRA EMPTY BOXES REMOVED) -->
        <section id="theatrical" class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-purple-100">
            <h2 class="text-2xl font-bold text-[#4C1D95] mb-6 uppercase tracking-wider border-b border-purple-100 pb-3">
                Theatrical Headshots
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="headshot-animate aspect-[3/4] overflow-hidden rounded-lg bg-gray-100 cursor-pointer shadow-sm border border-purple-50 group" style="animation-delay: 0.1s;">
                    <img src="theatrical_1.jpg" alt="Theatrical Look 1" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                </div>
                <div class="headshot-animate aspect-[3/4] overflow-hidden rounded-lg bg-gray-100 cursor-pointer shadow-sm border border-purple-50 group" style="animation-delay: 0.2s;">
                    <img src="theatrical_2.jpg" alt="Theatrical Look 2" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                </div>
                <div class="headshot-animate aspect-[3/4] overflow-hidden rounded-lg bg-gray-100 cursor-pointer shadow-sm border border-purple-50 group" style="animation-delay: 0.3s;">
                    <img src="theatrical_3.jpg" alt="Theatrical Look 3" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                </div>
                <div class="headshot-animate aspect-[3/4] overflow-hidden rounded-lg bg-gray-100 cursor-pointer shadow-sm border border-purple-50 group" style="animation-delay: 0.4s;">
                    <img src="theatrical_5.jpg" alt="Theatrical Look 5" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                </div>
            </div>
        </section>

        <!-- SECTION 3: COMMERCIAL HEADSHOTS -->
        <section id="commercial" class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-purple-100">
            <h2 class="text-2xl font-bold text-[#4C1D95] mb-6 uppercase tracking-wider border-b border-purple-100 pb-3">
                Commercial Headshots
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="headshot-animate aspect-[3/4] overflow-hidden rounded-lg bg-gray-100 cursor-pointer shadow-sm border border-purple-50 group" style="animation-delay: 0.1s;">
                    <img src="commercial_1.jpg" alt="Commercial Look 1" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                </div>
                <div class="headshot-animate aspect-[3/4] overflow-hidden rounded-lg bg-gray-100 cursor-pointer shadow-sm border border-purple-50 group" style="animation-delay: 0.25s;">
                    <img src="commercial_2.jpg" alt="Commercial Look 2" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                </div>
                <div class="headshot-animate aspect-[3/4] overflow-hidden rounded-lg bg-gray-100 cursor-pointer shadow-sm border border-purple-50 group" style="animation-delay: 0.4s;">
                    <img src="commercial_3.jpg" alt="Commercial Look 3" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                </div>
            </div>
        </section>

        <!-- SECTION 4: RED CARPETS & MEDIA -->
        <section id="media" class="space-y-8">
            <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-purple-100">
                <h2 class="text-2xl font-bold text-[#4C1D95] mb-6 uppercase tracking-wider border-b border-purple-100 pb-3">
                    Red Carpet Gallery
                </h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <div class="aspect-square overflow-hidden rounded-lg bg-gray-50 border cursor-pointer">
                        <img src="red_carpet_1.jpg" alt="Red Carpet" class="w-full h-full object-cover">
                    </div>
                    <div class="aspect-square overflow-hidden rounded-lg bg-gray-50 border cursor-pointer">
                        <img src="red_carpet_2.jpg" alt="Press Event" class="w-full h-full object-cover">
                    </div>
                    <div class="aspect-square overflow-hidden rounded-lg bg-gray-50 border cursor-pointer col-span-2 sm:col-span-1">
                        <img src="red_carpet_3.jpg" alt="Appearances" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-purple-100">
                <h2 class="text-2xl font-bold text-[#4C1D95] mb-6 uppercase tracking-wider border-b border-purple-100 pb-3">
                    Interviews & Media Presence
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <h3 class="text-sm font-bold text-gray-600 uppercase tracking-wider">Performance Reel</h3>
                        <div class="aspect-video w-full overflow-hidden rounded-xl bg-black shadow-inner">
                            <iframe class="w-full h-full" src="https://youtube.com" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <h3 class="text-sm font-bold text-gray-600 uppercase tracking-wider">Social Media & Press Interview</h3>
                        <div class="aspect-video w-full overflow-hidden rounded-xl bg-black shadow-inner">
                            <iframe class="w-full h-full" src="https://youtube.com" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION 5: RESUME -->
        <section id="resume" class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-purple-100 text-center space-y-6">
            <div class="text-left border-b border-purple-100 pb-3">
                <h2 class="text-2xl font-bold text-[#4C1D95] uppercase tracking-wider">Professional Resume</h2>
            </div>
        </section>

    </main>

</body>
</html>
